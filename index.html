  --sky-dusk:    #FFCBA4;
  --sky-night:   #1A1A3E;
  --sky-night-dark: #0D0420;
  --sky-night-light: #2D1B4E;
  --sky-sunset1: #FFCBA4;
  --sky-sunset2: #FF8C6B;
  --sky-sunset3: #D4607A;
  --ground:      #A8D5A2;
  --ground-dark: #7AB87A;
  --path:        #F0E0C8;
  --water:       #B0D8F0;
  --skin:        #FFD5B8;
  --hair:        #3D2314;
  --outfit-rose: #E8A0B0;
  --outfit-gold: #D4A843;
  --dialogue-bg: rgba(20, 10, 15, 0.88);
  --dialogue-border: #D4A843;
  --choice-bg:   #3A1A24;
  --choice-hover:#C0607A;
  --text-main:   #FFF8F5;
  --text-name:   #F5E0A0;
  --text-accent: #E8A0B0;
  --font-pixel:  'Press Start 2P', monospace;
  --font-story:  'VT323', monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background-color: #000;
  overflow: hidden;
  font-family: var(--font-story);
  color: var(--text-main);
}

#root {
  width: 100vw; height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#game-container {
  width: 480px; height: 270px;
  position: absolute;
  left: 50%; top: 50%;
  margin-left: -240px; margin-top: -135px;
  transform-origin: center;
  image-rendering: -moz-crisp-edges;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
  overflow: hidden;
}

#bg-layer {
  position: absolute;
  width: 100%; height: 100%;
  transition: opacity 1s, background 1s;
}

.bg-bedroom {
  background: linear-gradient(180deg, var(--sky-dawn) 0%, #FFECF0 40%, #FFF0F5 40%, #FFF0F5 75%, #F0D8C0 75%);
}
.bg-bedroom::after {
  content: ""; position: absolute;
  top: 10%; right: 10%; width: 60px; height: 80px;
  border: 4px solid #fff; background: rgba(255,255,255,0.2);
}

.bg-town_street {
  background: linear-gradient(180deg, var(--sky-day) 0%, #E8F4FF 60%, var(--ground-dark) 60%, var(--ground) 65%);
}
.bg-town_street::after {
  content: ""; position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 120px; height: 100px; background: var(--path);
}

.bg-music_room {
  background: linear-gradient(180deg, #5c3a21 0%, #3a1c0d 100%);
  border-left: 20px solid #2a1105;
  border-right: 20px solid #2a1105;
}

.bg-garden {
  background: linear-gradient(180deg, var(--sky-sunset1) 0%, var(--sky-sunset2) 40%, var(--sky-sunset3) 60%, var(--ground-dark) 60%, var(--ground) 65%);
}

.bg-dream_world {
  background: linear-gradient(180deg, var(--sky-night-dark) 0%, var(--sky-night) 50%, var(--sky-night-light) 100%);
}

.bg-ending {
  background: linear-gradient(180deg, #090211 0%, #170A2D 100%);
}

  position: absolute;

}

  position: absolute;

}

  width: 60px; height: 54px;
  background: #000;
  transform: scale(0);

}
@keyframes pixelOut {
  from { transform: scale(1.05); }
  to { transform: scale(0); }
}

// AUDIO
const AudioEngine = {
  ctx: null,
  bgmTimeout: null,
  currentBGMName: null,
  bgmOscillators: [],
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  playMelody(notes, isBgm = false) {
    if (!this.ctx) return 0;
    let time = this.ctx.currentTime;
    let totalDur = 0;
    notes.forEach(([freq, dur]) => {
      totalDur += dur;
      if (freq === 0) { time += dur; return; }
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.type = isBgm ? 'triangle' : 'square';
      osc.frequency.value = freq;
      const vol = isBgm ? 0.012 : 0.04;
      gain.gain.setValueAtTime(vol, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + dur - 0.01);
      osc.start(time);
      osc.stop(time + dur);
      if (isBgm) this.bgmOscillators.push(osc);
      time += dur;
    });
    return totalDur;
  },
  playSFX(type) {
    if (!this.ctx || !state.sfxEnabled) return;
    const sfx = {
      chime:    [[880, 0.1], [1047, 0.1], [1319, 0.2]],
      click:    [[880, 0.02]],
      sparkle:  [[1568, 0.05], [1760, 0.05], [2093, 0.1]],
    };
    if (sfx[type]) this.playMelody(sfx[type], false);
  },
  setBGM(name) {
    if (this.currentBGMName === name) return;
    this.currentBGMName = name;
    this.stopBGM();
    if (name && state.sfxEnabled) {
      this.loopBGM(name);
    }
  },
  loopBGM(name) {
    if (this.currentBGMName !== name || !state.sfxEnabled) return;
    const notes = BGM[name];
    if (!notes) return;
    const dur = this.playMelody(notes, true);
    this.bgmTimeout = setTimeout(() => {
      this.bgmOscillators = [];
      this.loopBGM(name);
    }, dur * 1000);
  },
  stopBGM() {
    clearTimeout(this.bgmTimeout);
    this.bgmTimeout = null;
    this.bgmOscillators.forEach(o => { try{o.stop()}catch(e){} });
    this.bgmOscillators = [];
  },
  toggleMute() {
    state.sfxEnabled = !state.sfxEnabled;
    if (!state.sfxEnabled) {
      this.stopBGM();
    } else if (this.currentBGMName) {
      this.loopBGM(this.currentBGMName);
    }
  }
};

function resizeGame() {
  const container = document.getElementById('game-container');
  const w = window.innerWidth;
  const h = window.innerHeight;
  const isPortrait = h > w;
  
  if (isPortrait) {
    state.scale = Math.min(h / 480, w / 270) * 0.98;
    container.style.transform = `scale(${state.scale}) rotate(90deg)`;
  } else {
    state.scale = Math.min(w / 480, h / 270) * 0.98;
    container.style.transform = `scale(${state.scale})`;
  }
}

window.addEventListener('resize', resizeGame);

  const totalPixels = 8 * 5;
  for(let i=0; i<totalPixels; i++) {
    const p = document.createElement('div');
    p.className = 'transition-pixel';
    p.style.animation = `pixelIn 0.3s forwards ${Math.random() * 0.3}s`;
    overlay.appendChild(p);
  }
  setTimeout(() => {
    callback();
    Array.from(overlay.children).forEach(p => {
      p.style.animation = `pixelOut 0.3s forwards ${Math.random() * 0.3}s`;
    });
    setTimeout(() => overlay.innerHTML = '', 600);
  }, 700);
}

function updateCharacter(slotId, charName) {
  const slot = document.getElementById(slotId);
  if (charName) {
    slot.className = `character-slot sprite-${charName}`;
    slot.style.opacity = 1;
  } else {
    slot.style.opacity = 0;
  }
}

function showChapterTitle(title) {
  const el = document.getElementById('chapter-title');
  el.innerText = title;
  el.style.opacity = 1;
  pixelTransition(() => {});
  setTimeout(() => el.style.opacity = 0, 2000);
}

function screenShake() {
  const el = document.getElementById('game-container');
  let startTime = Date.now();
  const shake = () => {
    const elapsed = Date.now() - startTime;
    if (elapsed > 400) {
      el.style.transform = `scale(${state.scale}) translate(0px, 0px)`;
      return;
    }
    const x = (Math.random() - 0.5) * 10;
    const y = (Math.random() - 0.5) * 10;
    el.style.transform = `scale(${state.scale}) translate(${x}px, ${y}px)`;
    requestAnimationFrame(shake);
  }
  shake();
}

const particles = [];
function spawnParticles(type) {
  for(let i=0; i<20; i++) {
    particles.push({
      x: Math.random() * 480,
      y: type==='confetti' ? -10 : Math.random() * 270,
      vx: (Math.random() - 0.5) * 2,
      vy: type==='confetti' ? Math.random()*2+2 : -Math.random()*2-1,
      size: Math.random() > 0.5 ? 4 : 8,
      color: type==='sparkle' ? '#FFF' : type==='petal' ? '#E8A0B0' : ['#FFD6E0','#D4A843','#A8D5A2'][Math.floor(Math.random()*3)],
      life: 1
    });
  }
}

function updateParticles() {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,480,270);
  for(let i=particles.length-1; i>=0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= 0.01;
    if (p.life <= 0) particles.splice(i, 1);
    else {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
  }
  requestAnimationFrame(updateParticles);
}

function goToScene(sceneId) {
  pixelTransition(() => {
    state.currentScene = sceneId;
    currentLineIndex = 0;
    const scene = scenes[sceneId];
    
    document.getElementById('bg-layer').className = `bg-${scene.bg}`;
    updateCharacter('char-left', scene.charLeft);
    updateCharacter('char-center', scene.charCenter);
    updateCharacter('char-right', scene.charRight);
    
    if (scene.bgm) {
      document.getElementById('bgm-label').innerText = `♪ ${scene.bgm}`;
      AudioEngine.setBGM(scene.bgm);
    } else {
      document.getElementById('bgm-label').innerText = `♪ none`;
      AudioEngine.setBGM(null);
    }
    
    document.getElementById('choices-container').innerHTML = '';
    
    if (scene.onEnter) scene.onEnter();
    
    if (scene.dialogue && scene.dialogue.length > 0) {
      document.getElementById('dialogue-box').style.display = 'block';
      playDialogue(scene.dialogue[0]);
    } else {
      document.getElementById('dialogue-box').style.display = 'none';
    }
  });
}

function advanceScene(target) {
  goToScene(target);
}

function playDialogue(line) {
  isTyping = true;
  document.getElementById('speaker-name').innerText = line.speaker;
  document.getElementById('continue-indicator').style.display = 'none';
  const textEl = document.getElementById('dialogue-text');
  textEl.innerText = '';
  
  let i = 0;
  const typeInterval = setInterval(() => {
    textEl.innerText += line.text[i];
    if (i % 3 === 0) AudioEngine.playSFX('click');
    i++;
    if (i >= line.text.length) {
      clearInterval(typeInterval);
      isTyping = false;
      if (!scenes[state.currentScene].choices || currentLineIndex < scenes[state.currentScene].dialogue.length - 1) {
        document.getElementById('continue-indicator').style.display = 'block';
      } else if (scenes[state.currentScene].choices) {
        showChoices(scenes[state.currentScene].choices);
      }
    }
  }, 40);
}

function nextDialogue() {
  if (isTyping) return;
  const scene = scenes[state.currentScene];
  if (!scene || !scene.dialogue) return;
  
  if (currentLineIndex < scene.dialogue.length - 1) {
    currentLineIndex++;
    playDialogue(scene.dialogue[currentLineIndex]);
  } else if (!scene.choices && scene.next) {
    advanceScene(scene.next);
  }
}

function showChoices(choices) {
  const container = document.getElementById('choices-container');
  container.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerText = `▶ ${c.text}`;
    btn.onclick = (e) => {
      e.stopPropagation();
      advanceScene(c.next);
    };
    btn.onmouseenter = () => AudioEngine.playSFX('sparkle');
    container.appendChild(btn);
  });
}

document.getElementById('dialogue-box').addEventListener('click', () => {
  nextDialogue();
});
document.addEventListener('touchstart', (e) => {
  if (e.target.closest('.choice-btn') || e.target.closest('#title-screen') || e.target.closest('#mute-btn')) return;
  if (document.getElementById('dialogue-box').style.display === 'block') {
    nextDialogue();
  }
}, {passive:true});

document.getElementById('btn-start').onclick = () => {
  AudioEngine.init();
  document.getElementById('title-screen').style.display = 'none';
  resizeGame();
  updateParticles();
  goToScene('wake_up');
};

document.getElementById('mute-btn').onclick = () => {
  AudioEngine.toggleMute();
  document.getElementById('mute-btn').innerText = state.sfxEnabled ? '♪ ON' : '♪ OFF';
};

resizeGame();

</script>
</body>
</html>
